<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#1B2234"/>
      <stop offset="0.55" stop-color="#101521"/>
      <stop offset="1" stop-color="#07080D"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6DA"/>
      <stop offset="0.42" stop-color="#F2B34B"/>
      <stop offset="1" stop-color="#B8720C"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.52" r="0.42">
      <stop offset="0" stop-color="#F2B34B" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#F2B34B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="toplight" cx="0.28" cy="0.06" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <rect width="512" height="512" rx="118" fill="url(#toplight)"/>
  <rect width="512" height="512" rx="118" fill="url(#halo)"/>

  <!-- 内部微光，像字在发光 -->
  <path d="M92 168 L170 356 L256 232 L342 356 L420 168"
        fill="none" stroke="#F2B34B" stroke-opacity="0.42" stroke-width="48"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)"/>

  <!-- W 字标 -->
  <path d="M92 168 L170 356 L256 232 L342 356 L420 168"
        fill="none" stroke="url(#ink)" stroke-width="42"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 顶端火花 -->
  <path d="M256 100 L263.5 121.5 L285 129 L263.5 136.5 L256 158 L248.5 136.5 L227 129 L248.5 121.5 Z" fill="#FFF6DA"/>

  <!-- 内描边 -->
  <rect x="2" y="2" width="508" height="508" rx="116" fill="none"
        stroke="#ffffff" stroke-opacity="0.075" stroke-width="4"/>
</svg>
