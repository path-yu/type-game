[package]
name = "typewake"
version = "0.1.0"
description = "TypeWake / 词醒 —— 用打字唤醒词语的英文训练游戏"
authors = ["TypeWake"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "typewake_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# schemars 0.8（tauri-build 的传递依赖）用 indexmap 1.x 且关掉了 default features。
# 不显式打开 std，`IndexMap<K, V, S = RandomState>` 的默认泛型会消失，schemars 直接编译失败。
# 注意：build-dependencies 与 dependencies 的特性是分开解析的，两边都要加。
indexmap = { version = "1.9", features = ["std"] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# schemars 0.8（tauri 传递依赖）用的是 indexmap 1.x，且关掉了 default features。
# 不显式打开 std，indexmap 的 `S = RandomState` 默认泛型会消失，schemars 直接编译失败。
indexmap = { version = "1.9", features = ["std"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
